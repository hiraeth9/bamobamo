<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>白膜预演工作台 · Previs Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="app">
    <!-- 顶部栏 -->
    <header class="topbar reveal">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div>
          <div class="brand-name">白膜预演工作台</div>
          <div class="brand-sub">Hermes × Blender MCP · Previs Console</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="status-pill">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">空闲</span>
        </div>
        <div class="status-pill num" id="gpuPill">RTX 3090</div>
      </div>
    </header>

    <!-- 主区：左输入 / 右进度 -->
    <main class="main-grid">
      <!-- 左：提示词输入 -->
      <section class="panel reveal">
        <div class="panel-head">
          <span class="panel-title">分镜指令</span>
          <span class="panel-badge">scene.json</span>
        </div>
        <textarea
          class="prompt-input"
          id="promptInput"
          placeholder="描述你要的白膜场景，例如：两个角色在街道对打，A 出拳，B 闪避后反击踢击，相机手持跟拍……"
        ></textarea>

        <div class="chips" id="chipRow">
          <button class="chip" data-prompt="两个角色拳击对打，A 出拳 B 闪避，手持相机快切">🥊 拳击对打</button>
          <button class="chip" data-prompt="三人混战，A 踢击 B 格挡 C 绕后，环绕相机">👊 三人混战</button>
          <button class="chip" data-prompt="单人持刀走位，镜头缓慢推近，紧张氛围">🗡️ 单人走位</button>
          <button class="chip" data-prompt="两个角色追逐奔跑穿过街道，相机侧跟">🏃 追逐奔跑</button>
        </div>

        <div class="param-row">
          <label class="param">
            分辨率
            <select id="resSelect">
              <option value="864x480" selected>864×480</option>
              <option value="1280x720">1280×720</option>
              <option value="1920x1080">1920×1080</option>
            </select>
          </label>
          <label class="param">
            帧率
            <select id="fpsSelect">
              <option value="24" selected>24</option>
              <option value="30">30</option>
            </select>
          </label>
          <label class="param">
            时长(秒)
            <input type="number" id="durInput" value="3" min="1" max="15" style="width:56px" />
          </label>
        </div>

        <button class="btn-primary" id="genBtn">
          <span>生成白膜视频</span>
        </button>

        <div class="log-console" id="logConsole" aria-live="polite"></div>
      </section>

      <!-- 右：实时进度 -->
      <section class="panel reveal">
        <div class="panel-head">
          <span class="panel-title">实时进度</span>
          <span class="panel-badge" id="progressBadge">就绪</span>
        </div>

        <div class="pipeline" id="pipeline">
          <div class="step" data-step="0">
            <div class="step-icon">01</div>
            <div class="step-body">
              <div class="step-name">解析提示词</div>
              <div class="step-desc">理解分镜意图</div>
            </div>
          </div>
          <div class="step" data-step="1">
            <div class="step-icon">02</div>
            <div class="step-body">
              <div class="step-name">生成分镜 scene.json</div>
              <div class="step-desc">角色 / 动作 / 相机轨道</div>
            </div>
          </div>
          <div class="step" data-step="2">
            <div class="step-icon">03</div>
            <div class="step-body">
              <div class="step-name">Blender 建场景</div>
              <div class="step-desc">加载角色 + 编排动作</div>
            </div>
          </div>
          <div class="step" data-step="3">
            <div class="step-icon">04</div>
            <div class="step-body">
              <div class="step-name">渲染帧序列</div>
              <div class="step-desc"><span class="frame-ticker" id="frameTicker">—</span></div>
            </div>
          </div>
          <div class="step" data-step="4">
            <div class="step-icon">05</div>
            <div class="step-body">
              <div class="step-name">合成视频</div>
              <div class="step-desc">ffmpeg → MP4</div>
            </div>
          </div>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-meta">
          <span id="progressPct">0%</span>
          <span class="num" id="progressTime">—</span>
        </div>
      </section>
    </main>

    <!-- 视频回放区 -->
    <section>
      <div class="panel-head reveal" style="margin-top: var(--space-4)">
        <span class="panel-title">成品视频</span>
        <span class="panel-badge num" id="videoCount">0 个</span>
      </div>
      <div class="video-grid" id="videoGrid">
        <div class="empty-state">
          <div class="empty-icon">◻</div>
          <div>还没有视频，输入提示词开始生成</div>
        </div>
      </div>
    </section>
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>

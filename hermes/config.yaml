# Hermes Agent 配置文件（白膜预演系统）
# 放置位置：~/.hermes/config.yaml
# 完整配置参考: https://hermes-agent.nousresearch.com/docs/user-guide/features/mcp
#
# ⚠️ 安全：本文件不含真实 API key。key 请单独写入 ~/.hermes/config.yaml 的
#    model.api_key 字段（或 .env），不要提交到 git。

# =============================================================================
# LLM 模型配置 —— 阿里云百炼（OpenAI 兼容端点）
# =============================================================================
model:
  provider: "custom"
  # 阿里云百炼 OpenAI 兼容端点（替换成你自己的）
  base_url: "https://YOUR-ENDPOINT.aliyuncs.com/compatible-mode/v1"
  default: "qwen3.8-flash"
  # API key 不要写在这里，用 `hermes config set model.api_key <key>` 单独设置

# =============================================================================
# Blender MCP 接入 —— Hermes 通过 MCP 控制 Blender
# =============================================================================
mcp_servers:
  blender:
    # 用 wrapper 脚本（本地 mcp-for-blender 仓库 + 独立 venv），避免 uvx 下载慢
    command: "/root/blender_mcp_server.sh"
    args: []
    env:
      BLENDER_HOST: "127.0.0.1"   # Blender addon socket 地址
      BLENDER_PORT: "9876"         # Blender addon socket 端口
    timeout: 300
    enabled: true

# =============================================================================
# 说明：
# 1. 安装 Hermes:  curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
# 2. 设置模型:     hermes config set model.api_key <key>
# 3. 验证 MCP:     hermes mcp test blender
# 4. 启动对话:     hermes chat（或 hermes -z "提示词" 非交互）
# 5. 重载工具:     对话中输入 /reload-mcp
#
# wrapper 脚本 /root/blender_mcp_server.sh 内容：
#   export PYTHONPATH=/opt/mcp-for-blender/src
#   exec /opt/mcp-for-blender/.venv/bin/python -m blender_mcp.server "$@"
# =============================================================================
